# tokens.yaml

typography:
  fonts:
    sans: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
  sizes:
    base: 16px
  lineHeights:
    base: 1.6
    
colors:
  solarized:
    base:
      base03: "#002b36"
      base02: "#073642"
      base01: "#586e75"
      base00: "#657b83"
      base0:  "#839496"
      base1:  "#93a1a1"
      base2:  "#eee8d5"
      base3:  "#fdf6e3"

    accents:
      yellow:   "#b58900"
      orange:   "#cb4b16"
      red:      "#dc322f"
      magenta:  "#d33682"
      violet:   "#6c71c4"
      blue:     "#268bd2"
      cyan:     "#2aa198"
      green:    "#859900"

  themes:
    solarized-light:
      background: "=colors.solarized.base.base3"
      surface:    "=colors.solarized.base.base2"
      text:       "=colors.solarized.base.base00"
      muted:      "=colors.solarized.base.base01"
      border:     "=colors.solarized.base.base02"
      accent:     "=colors.solarized.accents.blue"
      danger:     "=colors.solarized.accents.red"
      success:    "=colors.solarized.accents.green"

    solarized-dark:
      background: "=colors.solarized.base.base03"
      surface:    "=colors.solarized.base.base02"
      text:       "=colors.solarized.base.base0"
      muted:      "=colors.solarized.base.base1"
      border:     "=colors.solarized.base.base01"
      accent:     "=colors.solarized.accents.cyan"
      danger:     "=colors.solarized.accents.red"
      success:    "=colors.solarized.accents.green"

