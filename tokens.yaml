spacing:
  1: 0.25rem
  2: 0.5rem
  3: 1rem
  4: 2rem
  5: 4rem

radii:
  sm: 4px
  md: 8px
  lg: 16px

zIndex:
  header: 100
  modal: 200
  tooltip: 300
  max: 999

shadows:
  sm: "0 1px 2px rgba(0, 0, 0, 0.06)"
  md: "0 2px 6px rgba(0, 0, 0, 0.12)"
  lg: "0 8px 24px rgba(0, 0, 0, 0.2)"

breakpoints:
  sm: 480px
  md: 768px
  lg: 1024px
  xl: 1280px
