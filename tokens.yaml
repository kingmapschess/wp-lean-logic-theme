# tokens.yaml

typography:
  fonts:
    sans: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
  sizes:
    base: 16px
  lineHeights:
    base: 1.6

colors:
  base:
    black: "#000000"
    white: "#ffffff"
    bg: "#ffffff"
    text: "#222222"
    accent: "#0066cc"
    muted: "#666666"
    border: "#dddddd"

  red:
    50:  "#fff1f0"
    100: "#ffe0dd"
    200: "#ffc1be"
    300: "#ff8f8a"
    400: "#f75a5a"
    500: "#e03a3e"
    600: "#c62f35"
    700: "#a42a30"
    800: "#88262c"
    900: "#732328"
    950: "#4a161b"

  amber:
    50:  "#fffbe8"
    100: "#fff1b8"
    200: "#ffe180"
    300: "#ffd04d"
    400: "#fcb72e"
    500: "#e89a1f"
    600: "#c17b1a"
    700: "#9a6117"
    800: "#7d4e15"
    900: "#674114"
    950: "#422a0f"

  yellow:
    50:  "#fffde7"
    100: "#fff9b2"
    200: "#fff176"
    300: "#ffe13b"
    400: "#facc15"
    500: "#eab308"
    600: "#c58f06"
    700: "#9a6d05"
    800: "#7a5706"
    900: "#654705"
    950: "#3f2e04"

  green:
    50:  "#f0fdf4"
    100: "#dcfce7"
    200: "#bbf7d0"
    300: "#86efac"
    400: "#4ade80"
    500: "#22c55e"
    600: "#16a34a"
    700: "#15803d"
    800: "#166534"
    900: "#14532d"
    950: "#052e16"

  blue:
    50:  "#eff6ff"
    100: "#dbeafe"
    200: "#bfdbfe"
    300: "#93c5fd"
    400: "#60a5fa"
    500: "#3b82f6"
    600: "#2563eb"
    700: "#1d4ed8"
    800: "#1e40af"
    900: "#1e3a8a"
    950: "#172554"

  slate:
    50:  "#f8fafc"
    100: "#f1f5f9"
    200: "#e2e8f0"
    300: "#cbd5e1"
    400: "#94a3b8"
    500: "#64748b"
    600: "#475569"
    700: "#334155"
    800: "#1e293b"
    900: "#0f172a"
    950: "#020617"

  gray:
    50:  "#f9fafb"
    100: "#f3f4f6"
    200: "#e5e7eb"
    300: "#d1d5db"
    400: "#9ca3af"
    500: "#6b7280"
    600: "#4b5563"
    700: "#374151"
    800: "#1f2937"
    900: "#111827"
    950: "#030712"

  neutral:
    50:  "#fafafa"
    100: "#f5f5f5"
    200: "#e5e5e5"
    300: "#d4d4d4"
    400: "#a3a3a3"
    500: "#737373"
    600: "#525252"
    700: "#404040"
    800: "#262626"
    900: "#171717"
    950: "#0a0a0a"

  stone:
    50:  "#fafaf9"
    100: "#f5f5f4"
    200: "#e7e5e4"
    300: "#d6d3d1"
    400: "#a8a29e"
    500: "#78716c"
    600: "#57534e"
    700: "#44403c"
    800: "#292524"
    900: "#1c1917"
    950: "#0c0a09"

  primary:
    50:  "=colors.blue.50"
    100: "=colors.blue.100"
    200: "=colors.blue.200"
    300: "=colors.blue.300"
    400: "=colors.blue.400"
    500: "=colors.blue.500" 
    600: "=colors.blue.600"
    700: "=colors.blue.700"
    800: "=colors.blue.800"
    900: "=colors.blue.900"

  semantic:
    success: "=colors.green.500"
    warning: "=colors.amber.500"
    danger:  "=colors.red.500"

spacing:
  1: 0.25rem
  2: 0.5rem
  3: 1rem
  4: 2rem
  5: 4rem

radii:
  sm: 4px
  md: 8px
  lg: 16px

zIndex:
  header: 100
  modal: 200
  tooltip: 300
  max: 999

shadows:
  sm: "0 1px 2px rgba(0, 0, 0, 0.06)"
  md: "0 2px 6px rgba(0, 0, 0, 0.12)"
  lg: "0 8px 24px rgba(0, 0, 0, 0.2)"

breakpoints:
  sm: 480px
  md: 768px
  lg: 1024px
  xl: 1280px
